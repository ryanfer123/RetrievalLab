[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-lab-local"
version = "0.1.0"
description = "An inspectable local retrieval evaluation workbench"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
include = ["retrieval_lab*"]

[tool.setuptools.package-data]
retrieval_lab = ["web/*", "web/vendor/*"]
